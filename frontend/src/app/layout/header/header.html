<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/events">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
      </span>
      <span class="brand-name">EventHub</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/events" routerLinkActive="active">Explore Events</a>

      @if (auth.role() === 'attendee') {
        <a routerLink="/my-registrations" routerLinkActive="active">My Registrations</a>
      }

      @if (auth.role() === 'organiser') {
        <a routerLink="/organiser/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/organiser/events" routerLinkActive="active">Manage Events</a>
      }
    </nav>

    <div class="account">
      @if (auth.currentUser(); as user) {
        <span class="account-name">{{ user.name }}</span>
        <span class="account-role" [class.is-organiser]="user.role === 'organiser'">
          {{ user.role }}
        </span>
        <button class="logout" type="button" (click)="auth.logout()">Log out</button>
      } @else {
        <a class="auth-link" routerLink="/login">Log in</a>
        <a class="auth-button" routerLink="/register">Register</a>
      }
    </div>
  </div>
</header>
