<section class="page">
  <a class="back-link" routerLink="/organiser/events">
    <fa-icon [icon]="faArrowLeft" aria-hidden="true" />
    Back to Manage events
  </a>

  <header class="page-header reveal">
    <p class="eyebrow">ORGANISER</p>
    <h1>Create event</h1>
    <p class="subtitle">
      Fill in the details. You can publish right away or save it as a draft.
    </p>
  </header>

  <app-event-form
    mode="create"
    [submitting]="submitting()"
    [serverError]="serverError()"
    (save)="save($event)"
  />
</section>
